<!doctype html>
<html>
  <body>
    <h1>Home</h1>

    {% if user.is_authenticated %}
      <p>Logged in as <b>{{ user.username }}</b></p>

      <ul>
        <li><a href="{% url 'my_timetable' %}">My timetable</a></li>
        <li><a href="{% url 'logout' %}">Logout</a></li>
      </ul>
    {% else %}
      <ul>
        <li><a href="{% url 'login' %}">Login</a></li>
        <li><a href="{% url 'signup' %}">Signup</a></li>
      </ul>
    {% endif %}
  </body>
</html>
